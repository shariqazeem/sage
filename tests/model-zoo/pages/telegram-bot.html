<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Telegram: Launch @pricewatch_bot</title>
</head>
<body>
<div class="tgme_page_wrap">
  <div class="tgme_head_wrap"><a class="tgme_head_dl_button" href="//telegram.org/dl?tme=1">Download</a></div>
  <div class="tgme_page">
    <div class="tgme_page_title"><span dir="auto">PriceWatch</span></div>
    <div class="tgme_page_extra">@pricewatch_bot</div>
    <div class="tgme_page_description">Track any Metis token. Send /price and a symbol to get the price, or /alert to be told when it moves.</div>
    <div class="tgme_page_action"><a class="tgme_action_button_new shine" href="tg://resolve?domain=pricewatch_bot">Start Bot</a></div>
    <div class="tgme_page_additional">If you have <strong>Telegram</strong>, you can launch <strong>PriceWatch</strong> right away.</div>
  </div>
</div>
</body>
</html>
