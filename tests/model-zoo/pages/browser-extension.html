<title>TabTidy - Chrome Web Store</title>

<body>
<header><a href="/">chrome web store</a> <a href="/category/extensions">Extensions</a> <a href="/category/themes">Themes</a></header>
<main>
  <h1>TabTidy</h1>
  <button>Add to Chrome</button>
  <h2>Overview</h2>
  <p>TabTidy groups your open tabs by site with one click and puts the ones you have not looked at in a day to sleep.</p>
  <h2>Privacy</h2>
  <p>TabTidy reads the addresses of your open tabs to group them. It does not send them anywhere.</p>
</main>
