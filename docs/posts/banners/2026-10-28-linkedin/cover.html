<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;650&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0}
  body{width:1128px;height:191px;background:#fbfbf9;font-family:Inter,system-ui,sans-serif;color:#1a1d21;overflow:hidden;position:relative}
  .wrap{position:absolute;left:300px;right:56px;top:0;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:32px}
  h1{margin:0;font-size:33px;line-height:1.08;font-weight:650;letter-spacing:-0.02em}
  p{margin:10px 0 0;font-size:15px;line-height:1.4;color:#5b616b;max-width:520px}
  .url{font-family:"JetBrains Mono",monospace;font-size:15px;font-weight:500;color:#c2410c;white-space:nowrap;border:1px solid #e7e2da;border-radius:999px;padding:9px 16px;background:#fff}
  .edge{position:absolute;left:0;right:0;bottom:0;height:7px;background:
    linear-gradient(135deg,#fbfbf9 25%,transparent 25%) -6px 0/12px 12px,
    linear-gradient(225deg,#fbfbf9 25%,transparent 25%) -6px 0/12px 12px,#c2410c;opacity:.9}
</style></head>
<body>
  <div class="wrap">
    <div>
      <h1>AI agents you can trust with money.</h1>
      <p>Sage checks the work and pays people in USDC, from a vault it can never overspend. Every payout gets a public receipt.</p>
    </div>
    <div class="url">sagepays.xyz</div>
  </div>
  <div class="edge"></div>
</body></html>
